version: '3.8'

services:
  product-api:
    build:
      context: .
      dockerfile: services/product-api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=tcp:microservices-2026.database.windows.net,1433;Initial Catalog=MicroservicesDb;Persist Security Info=False;User ID=Mangena;Password=${DB_PASSWORD};MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;

  order-api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=tcp:microservices-2026.database.windows.net,1433;Initial Catalog=MicroservicesDb;Persist Security Info=False;User ID=Mangena;Password=${DB_PASSWORD};MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=tcp:microservices-2026.database.windows.net,1433;Initial Catalog=MicroservicesDb;Persist Security Info=False;User ID=Mangena;Password=${DB_PASSWORD};MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=tcp:microservices-2026.database.windows.net,1433;Initial Catalog=MicroservicesDb;Persist Security Info=False;User ID=Mangena;Password=${DB_PASSWORD};MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
